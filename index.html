<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pump.fun Scanner</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🚀 Pump.fun Scanner</h1>

    <p class="subtitle">
      Fast token analysis
    </p>

    <!-- LOGIN -->
    <div id="loginBox" class="card">

      <h2>🔐 Private Scanner</h2>

      <p class="subtitle">
        Enter your password to continue.
      </p>

      <input
        id="passwordInput"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
      >

      <button onclick="login()">
        🔓 Login
      </button>

      <div id="loginResult"></div>

    </div>

    <!-- SCANNER -->
    <div id="scannerBox" style="display:none;">

      <div class="card">

        <input
          id="tokenInput"
          type="text"
          placeholder="Paste Pump.fun link or Contract Address"
          autocomplete="off"
        >

        <button onclick="scanToken()">
          🔍 Scan Token
        </button>

      </div>

      <div id="result"></div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
